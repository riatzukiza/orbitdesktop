name: Orbit plugin tests
env:
  ONNXRUNTIME_NODE_INSTALL: skip
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Real-project acceptance reads exact files from the pinned baseline.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - name: Prepare isolated test scratch directory
        run: mkdir -p /tmp/opencode
      - run: npm run check
      - name: Constellation authentication and observation boundaries
        run: |
          node --test integrations/constellation/test-axxium-auth.mjs integrations/constellation/test-surface.mjs integrations/constellation/test-terminal-scope.mjs integrations/constellation/test-gateway-boundaries.mjs
          python3 -m unittest integrations/constellation/test_bridge.py
      - run: python3 -m unittest discover -s tests -p test_hermes_plugin.py -v
      - run: python3 -m unittest discover -s tests -p test_normal_resource_retention.py -v
      - name: Widget schema and publisher parity
        run: |
          python3 tests/plugin-config-schema.test.py
          python3 tests/plugin-publish.test.py
          python3 tests/test_orbit_bundle.py
